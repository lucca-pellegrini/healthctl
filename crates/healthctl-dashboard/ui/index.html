<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCtl Fitness Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 300;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
        }

        .metric-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metric-unit {
            font-size: 14px;
            color: #666;
            margin-left: 5px;
        }

        .metric-change {
            font-size: 12px;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .metric-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            opacity: 0.2;
        }

        .heart-rate-card {
            grid-column: span 2;
            background: linear-gradient(135deg, #1a0d0d 0%, #0d0d0d 100%);
        }

        .heart-rate-card::before {
            background: linear-gradient(90deg, #ff0044, #ff6b6b);
        }

        .heart-rate-card .metric-value {
            background: linear-gradient(135deg, #ff0044, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gauge-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
        }

        .gauge {
            width: 100%;
            height: 100%;
        }

        .chart-container {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            height: 300px;
        }

        .chart-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        #activityChart {
            width: 100%;
            height: 250px;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .progress-ring {
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 8;
        }

        .progress-ring .progress-ring-bg {
            stroke: #1a1a1a;
        }

        .progress-ring .progress-ring-fill {
            stroke: #00d4ff;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.5s;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Fitness Tracker</h1>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Connected</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="metric-card heart-rate-card">
            <div class="metric-label">Heart Rate</div>
            <div class="metric-value" id="heartRate">--</div>
            <div class="metric-unit">bpm</div>
            <div class="metric-change">↑ 5% from average</div>
            <div class="metric-icon">❤️</div>
            <svg class="gauge-container">
                <circle cx="100" cy="100" r="90" fill="none" stroke="#1a1a1a" stroke-width="10"/>
                <circle id="hrGauge" cx="100" cy="100" r="90" fill="none" stroke="#ff0044" stroke-width="10" 
                    stroke-dasharray="565" stroke-dashoffset="565" 
                    transform="rotate(-90 100 100)" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="metric-card">
            <div class="metric-label">Steps Today</div>
            <div class="metric-value" id="steps">--</div>
            <div class="metric-change">68% of goal</div>
            <div class="metric-icon">👟</div>
            <svg class="progress-ring">
                <circle class="progress-ring-bg" cx="60" cy="60" r="54"/>
                <circle class="progress-ring-fill" id="stepsRing" cx="60" cy="60" r="54"
                    stroke-dasharray="339" stroke-dashoffset="109"/>
            </svg>
        </div>

        <div class="metric-card">
            <div class="metric-label">Calories Burned</div>
            <div class="metric-value" id="calories">--</div>
            <div class="metric-unit">kcal</div>
            <div class="metric-change">↑ 12% from yesterday</div>
            <div class="metric-icon">🔥</div>
        </div>

        <div class="metric-card">
            <div class="metric-label">Distance</div>
            <div class="metric-value" id="distance">--</div>
            <div class="metric-unit">km</div>
            <div class="metric-change">Good pace!</div>
            <div class="metric-icon">📍</div>
        </div>

        <div class="metric-card">
            <div class="metric-label">Active Minutes</div>
            <div class="metric-value" id="activeMinutes">--</div>
            <div class="metric-unit">min</div>
            <div class="metric-change">Keep going!</div>
            <div class="metric-icon">⏱️</div>
        </div>

        <div class="metric-card">
            <div class="metric-label">Sleep</div>
            <div class="metric-value" id="sleepHours">--</div>
            <div class="metric-unit">hours</div>
            <div class="metric-change">Quality: Good</div>
            <div class="metric-icon">😴</div>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-title">Weekly Activity</div>
        <canvas id="activityChart"></canvas>
    </div>

    <script type="module">
        const { invoke } = window.__TAURI__.core;

        async function updateDashboard() {
            try {
                const metrics = await invoke('get_metrics');
                
                // Update metric values
                document.getElementById('heartRate').textContent = metrics.heart_rate || '--';
                document.getElementById('steps').textContent = metrics.steps?.toLocaleString() || '--';
                document.getElementById('calories').textContent = metrics.calories?.toFixed(0) || '--';
                document.getElementById('distance').textContent = metrics.distance?.toFixed(1) || '--';
                document.getElementById('activeMinutes').textContent = metrics.active_minutes || '--';
                document.getElementById('sleepHours').textContent = metrics.sleep_hours?.toFixed(1) || '--';

                // Update heart rate gauge
                if (metrics.heart_rate) {
                    const hrPercent = Math.min((metrics.heart_rate / 200) * 100, 100);
                    const hrOffset = 565 - (565 * hrPercent / 100);
                    document.getElementById('hrGauge').style.strokeDashoffset = hrOffset;
                }

                // Update steps ring
                if (metrics.steps) {
                    const stepsGoal = 10000;
                    const stepsPercent = Math.min((metrics.steps / stepsGoal) * 100, 100);
                    const stepsOffset = 339 - (339 * stepsPercent / 100);
                    document.getElementById('stepsRing').style.strokeDashoffset = stepsOffset;
                }

            } catch (error) {
                console.error('Failed to fetch metrics:', error);
            }
        }

        // Draw activity chart
        function drawActivityChart() {
            const canvas = document.getElementById('activityChart');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const data = [65, 78, 90, 81, 56, 95, 88];
            
            const barWidth = canvas.width / days.length * 0.6;
            const spacing = canvas.width / days.length * 0.4;
            const maxValue = Math.max(...data);

            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            data.forEach((value, index) => {
                const barHeight = (value / maxValue) * (canvas.height - 40);
                const x = index * (barWidth + spacing) + spacing / 2;
                const y = canvas.height - barHeight - 20;

                // Draw bar
                const gradient = ctx.createLinearGradient(0, y, 0, canvas.height - 20);
                gradient.addColorStop(0, '#00d4ff');
                gradient.addColorStop(1, '#00ff88');
                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, barWidth, barHeight);

                // Draw day label
                ctx.fillStyle = '#666';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(days[index], x + barWidth / 2, canvas.height - 5);

                // Draw value
                ctx.fillStyle = '#888';
                ctx.fillText(value + '%', x + barWidth / 2, y - 5);
            });
        }

        // Initialize dashboard
        updateDashboard();
        drawActivityChart();

        // Update every 5 seconds
        setInterval(updateDashboard, 5000);

        // Redraw chart on resize
        window.addEventListener('resize', drawActivityChart);
    </script>
</body>
</html>
