<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCtl Dashboard</title>
    <style>
        /* Theme variables */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111;
            --bg-tertiary: #1a1a1a;
            --bg-hover: #222;
            --border-primary: #333;
            --border-secondary: #222;
            --border-tertiary: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --text-muted: #666;
            --text-dim: #444;
            --accent-primary: #00d4ff;
            --accent-secondary: #00ff88;
            --accent-success: #44dd88;
            --accent-warning: #ff8844;
            --accent-error: #ff4444;
            --scrollbar-track: #111;
            --scrollbar-thumb: #333;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8e8;
            --bg-hover: #ddd;
            --border-primary: #ccc;
            --border-secondary: #ddd;
            --border-tertiary: #e5e5e5;
            --text-primary: #1a1a1a;
            --text-secondary: #555;
            --text-muted: #777;
            --text-dim: #aaa;
            --accent-primary: #0099cc;
            --accent-secondary: #00aa66;
            --accent-success: #22aa66;
            --accent-warning: #dd6622;
            --accent-error: #dd3333;
            --scrollbar-track: #e8e8e8;
            --scrollbar-thumb: #bbb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-primary);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 300;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.connected { background: var(--accent-secondary); }
        .status-dot.error { background: var(--accent-error); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .streak-widget {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 6px;
            padding: 6px 12px;
            transition: background 0.3s, border-color 0.3s;
        }

        .streak-icon {
            font-size: 16px;
        }

        .streak-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-warning);
        }

        .streak-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .streak-widget.active {
            border-color: color-mix(in srgb, var(--accent-warning) 40%, transparent);
            box-shadow: 0 0 10px color-mix(in srgb, var(--accent-warning) 15%, transparent);
        }

        .streak-widget.active .streak-icon {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-secondary);
            border-radius: 8px;
            padding: 16px;
            transition: background 0.3s, border-color 0.3s;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Today's Summary */
        .today-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        /* Stat Card */
        .stat-card {
            height: 90px;
            cursor: pointer;
            position: relative;
        }

        .stat-card.animating {
            visibility: hidden;
        }

        .stat-card-front {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hover effects */
        .stat-card:hover .stat-card-front {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        [data-theme="light"] .stat-card:hover .stat-card-front {
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        /* Color-specific borders and glows on hover */
        .stat-card[data-metric="steps"]:hover .stat-card-front {
            border-color: #00d4ff66;
            box-shadow: 0 0 20px #00d4ff22, 0 8px 24px rgba(0,0,0,0.4);
        }
        .stat-card[data-metric="calories"]:hover .stat-card-front {
            border-color: #44dd8866;
            box-shadow: 0 0 20px #44dd8822, 0 8px 24px rgba(0,0,0,0.4);
        }
        .stat-card[data-metric="distance"]:hover .stat-card-front {
            border-color: #aa88ff66;
            box-shadow: 0 0 20px #aa88ff22, 0 8px 24px rgba(0,0,0,0.4);
        }
        .stat-card[data-metric="active"]:hover .stat-card-front {
            border-color: #ff884466;
            box-shadow: 0 0 20px #ff884422, 0 8px 24px rgba(0,0,0,0.4);
        }
        .stat-card[data-metric="sleep"]:hover .stat-card-front {
            border-color: #6699ff66;
            box-shadow: 0 0 20px #6699ff22, 0 8px 24px rgba(0,0,0,0.4);
        }
        .stat-card[data-metric="workouts"]:hover .stat-card-front {
            border-color: #ff664466;
            box-shadow: 0 0 20px #ff664422, 0 8px 24px rgba(0,0,0,0.4);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-primary);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Metric-specific value colors */
        .stat-card[data-metric="steps"] .stat-value { color: #00d4ff; }
        .stat-card[data-metric="calories"] .stat-value { color: #44dd88; }
        .stat-card[data-metric="distance"] .stat-value { color: #aa88ff; }
        .stat-card[data-metric="active"] .stat-value { color: #ff8844; }
        .stat-card[data-metric="sleep"] .stat-value { color: #6699ff; }
        .stat-card[data-metric="workouts"] .stat-value { color: #ff6644; }

        /* Modal Overlay - backdrop only */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 1999;
            pointer-events: none;
            transition: background 0.5s ease, backdrop-filter 0.5s ease;
        }

        .modal-overlay.show {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            pointer-events: auto;
        }

        /* Flying Card - the animated element */
        .flying-card {
            position: fixed;
            z-index: 2000;
            perspective: 1200px;
            pointer-events: none;
            visibility: hidden;
            opacity: 0;
        }

        .flying-card.show {
            pointer-events: auto;
            visibility: visible;
            opacity: 1;
        }

        .flying-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flying-card.flipped .flying-card-inner {
            transform: rotateY(180deg);
        }

        .flying-card-front,
        .flying-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            overflow: hidden;
        }

        .flying-card-front {
            background: var(--bg-tertiary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid transparent;
        }

        .flying-card-back {
            background: var(--bg-secondary);
            transform: rotateY(180deg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        /* Flying card metric colors */
        .flying-card[data-metric="steps"] .flying-card-front {
            border-color: #00d4ff66;
            box-shadow: 0 0 30px #00d4ff33, 0 12px 40px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="calories"] .flying-card-front {
            border-color: #44dd8866;
            box-shadow: 0 0 30px #44dd8833, 0 12px 40px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="distance"] .flying-card-front {
            border-color: #aa88ff66;
            box-shadow: 0 0 30px #aa88ff33, 0 12px 40px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="active"] .flying-card-front {
            border-color: #ff884466;
            box-shadow: 0 0 30px #ff884433, 0 12px 40px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="sleep"] .flying-card-front {
            border-color: #6699ff66;
            box-shadow: 0 0 30px #6699ff33, 0 12px 40px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="workouts"] .flying-card-front {
            border-color: #ff664466;
            box-shadow: 0 0 30px #ff664433, 0 12px 40px rgba(0,0,0,0.5);
        }

        [data-theme="light"] .flying-card[data-metric="steps"] .flying-card-front,
        [data-theme="light"] .flying-card[data-metric="calories"] .flying-card-front,
        [data-theme="light"] .flying-card[data-metric="distance"] .flying-card-front,
        [data-theme="light"] .flying-card[data-metric="active"] .flying-card-front,
        [data-theme="light"] .flying-card[data-metric="sleep"] .flying-card-front,
        [data-theme="light"] .flying-card[data-metric="workouts"] .flying-card-front {
            box-shadow: 0 0 20px rgba(0,0,0,0.1), 0 12px 40px rgba(0,0,0,0.15);
        }

        /* Flying card back (modal) colors */
        .flying-card[data-metric="steps"] .flying-card-back {
            border: 1px solid #00d4ff44;
            box-shadow: 0 0 50px #00d4ff22, 0 20px 60px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="calories"] .flying-card-back {
            border: 1px solid #44dd8844;
            box-shadow: 0 0 50px #44dd8822, 0 20px 60px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="distance"] .flying-card-back {
            border: 1px solid #aa88ff44;
            box-shadow: 0 0 50px #aa88ff22, 0 20px 60px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="active"] .flying-card-back {
            border: 1px solid #ff884444;
            box-shadow: 0 0 50px #ff884422, 0 20px 60px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="sleep"] .flying-card-back {
            border: 1px solid #6699ff44;
            box-shadow: 0 0 50px #6699ff22, 0 20px 60px rgba(0,0,0,0.5);
        }
        .flying-card[data-metric="workouts"] .flying-card-back {
            border: 1px solid #ff664444;
            box-shadow: 0 0 50px #ff664422, 0 20px 60px rgba(0,0,0,0.5);
        }

        [data-theme="light"] .flying-card[data-metric="steps"] .flying-card-back,
        [data-theme="light"] .flying-card[data-metric="calories"] .flying-card-back,
        [data-theme="light"] .flying-card[data-metric="distance"] .flying-card-back,
        [data-theme="light"] .flying-card[data-metric="active"] .flying-card-back,
        [data-theme="light"] .flying-card[data-metric="sleep"] .flying-card-back,
        [data-theme="light"] .flying-card[data-metric="workouts"] .flying-card-back {
            box-shadow: 0 0 30px rgba(0,0,0,0.1), 0 20px 60px rgba(0,0,0,0.15);
        }

        .flying-card-front .stat-value {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }

        .flying-card-front .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .flying-card[data-metric="steps"] .flying-card-front .stat-value { color: #00d4ff; }
        .flying-card[data-metric="calories"] .flying-card-front .stat-value { color: #44dd88; }
        .flying-card[data-metric="distance"] .flying-card-front .stat-value { color: #aa88ff; }
        .flying-card[data-metric="active"] .flying-card-front .stat-value { color: #ff8844; }
        .flying-card[data-metric="sleep"] .flying-card-front .stat-value { color: #6699ff; }
        .flying-card[data-metric="workouts"] .flying-card-front .stat-value { color: #ff6644; }

        /* Modal Card - now inside flying-card-back */
        .modal-card {
            background: transparent;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Modal header color themes - based on flying-card parent */
        .flying-card[data-metric="steps"] .modal-header {
            background: linear-gradient(135deg, #0a1a1f 0%, var(--bg-secondary) 100%);
            border-bottom-color: #00d4ff33;
        }
        .flying-card[data-metric="steps"] .modal-header-value { color: #00d4ff; }

        .flying-card[data-metric="calories"] .modal-header {
            background: linear-gradient(135deg, #0a1f15 0%, var(--bg-secondary) 100%);
            border-bottom-color: #44dd8833;
        }
        .flying-card[data-metric="calories"] .modal-header-value { color: #44dd88; }

        .flying-card[data-metric="distance"] .modal-header {
            background: linear-gradient(135deg, #151020 0%, var(--bg-secondary) 100%);
            border-bottom-color: #aa88ff33;
        }
        .flying-card[data-metric="distance"] .modal-header-value { color: #aa88ff; }

        .flying-card[data-metric="active"] .modal-header {
            background: linear-gradient(135deg, #1f1510 0%, var(--bg-secondary) 100%);
            border-bottom-color: #ff884433;
        }
        .flying-card[data-metric="active"] .modal-header-value { color: #ff8844; }

        .flying-card[data-metric="sleep"] .modal-header {
            background: linear-gradient(135deg, #101520 0%, var(--bg-secondary) 100%);
            border-bottom-color: #6699ff33;
        }
        .flying-card[data-metric="sleep"] .modal-header-value { color: #6699ff; }

        .flying-card[data-metric="workouts"] .modal-header {
            background: linear-gradient(135deg, #1f1210 0%, var(--bg-secondary) 100%);
            border-bottom-color: #ff664433;
        }
        .flying-card[data-metric="workouts"] .modal-header-value { color: #ff6644; }

        /* Light theme modal headers */
        [data-theme="light"] .flying-card[data-metric="steps"] .modal-header {
            background: linear-gradient(135deg, #e0f4ff 0%, var(--bg-secondary) 100%);
        }
        [data-theme="light"] .flying-card[data-metric="calories"] .modal-header {
            background: linear-gradient(135deg, #e0ffe8 0%, var(--bg-secondary) 100%);
        }
        [data-theme="light"] .flying-card[data-metric="distance"] .modal-header {
            background: linear-gradient(135deg, #f0e8ff 0%, var(--bg-secondary) 100%);
        }
        [data-theme="light"] .flying-card[data-metric="active"] .modal-header {
            background: linear-gradient(135deg, #fff0e8 0%, var(--bg-secondary) 100%);
        }
        [data-theme="light"] .flying-card[data-metric="sleep"] .modal-header {
            background: linear-gradient(135deg, #e8f0ff 0%, var(--bg-secondary) 100%);
        }
        [data-theme="light"] .flying-card[data-metric="workouts"] .modal-header {
            background: linear-gradient(135deg, #ffe8e8 0%, var(--bg-secondary) 100%);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .modal-header-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
        }

        .modal-header-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-close {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--border-primary);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section:last-child {
            margin-bottom: 0;
        }

        .modal-section-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-secondary);
        }

        .modal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-tertiary);
        }

        .modal-row:last-child {
            border-bottom: none;
        }

        .modal-row-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .modal-row-value {
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
        }

        .modal-row-value.positive {
            color: #44dd88;
        }

        .modal-row-value.negative {
            color: #ff6644;
        }

        .modal-row-value.projection {
            color: var(--accent-primary);
            font-style: italic;
        }

        .modal-breakdown {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-breakdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-breakdown-bar-bg {
            flex: 1;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }

        .modal-breakdown-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .modal-breakdown-label {
            width: 70px;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: capitalize;
        }

        .modal-breakdown-value {
            width: 60px;
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Color-specific breakdown bars */
        .flying-card[data-metric="steps"] .modal-breakdown-bar { background: linear-gradient(90deg, #00d4ff, #00ff88); }
        .flying-card[data-metric="calories"] .modal-breakdown-bar { background: linear-gradient(90deg, #22aa66, #66ee99); }
        .flying-card[data-metric="distance"] .modal-breakdown-bar { background: linear-gradient(90deg, #8855ee, #bb99ff); }
        .flying-card[data-metric="active"] .modal-breakdown-bar { background: linear-gradient(90deg, #ff5522, #ffaa44); }
        .flying-card[data-metric="sleep"] .modal-breakdown-bar { background: linear-gradient(90deg, #4477dd, #88bbff); }
        .flying-card[data-metric="workouts"] .modal-breakdown-bar { background: linear-gradient(90deg, #ee4422, #ff8866); }

        .sleep-night-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .sleep-night-date {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .sleep-night-hours {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        .sleep-night-quality {
            color: #ffcc00;
            font-size: 12px;
        }

        .muscle-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .muscle-tag {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            text-transform: capitalize;
        }

        /* Recent Activities */
        .activities-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            display: grid;
            grid-template-columns: 70px 1fr auto auto;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-tertiary);
            align-items: center;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-time {
            font-size: 12px;

</head>
<body>
    <div class="header">
        <h1>⚡ Fitness Dashboard</h1>
        <div class="header-right">
            <div class="streak-widget" id="streakWidget">
                <span class="streak-icon">🔥</span>

                    <div class="streak-value" id="streakValue">0</div>

            <div class="status">

    <div class="dashboard">

        <div class="panel">
            <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span id="summaryTitle">This Week</span>

                    <button class="week-selector-btn" id="weekSelectorBtn">

            <div class="today-grid" id="weekGrid">
                <div class="stat-card" data-metric="steps">

                <div class="stat-card" data-metric="distance">

        <!-- Modal Backdrop (blur overlay) -->
        <div class="modal-overlay" id="modalOverlay"></div>

        <!-- Flying Card (animated flip card) -->

        <!-- Weekly Chart -->

                <button class="chart-tab" data-metric="active">Active</button>
                <button class="chart-tab" data-metric="sleep">Sleep</button>

        <!-- Recent Activities -->
        <div class="panel" style="grid-column: span 2;">
            <div class="panel-title" id="activitiesTitle">Recent Activities</div>

    <!-- Delete Confirmation Dialog -->
    <div class="delete-dialog" id="deleteDialog">
        <div class="delete-dialog-content">
            <div class="delete-dialog-title">Delete Event?</div>
            <div class="delete-dialog-message">This action cannot be undone.</div>
            <div class="delete-dialog-event" id="deleteDialogEvent">
                <div class="delete-dialog-event-type" id="deleteEventType"></div>
                <div class="delete-dialog-event-time" id="deleteEventTime"></div>
            </div>
            <div class="delete-dialog-buttons">
                <button class="delete-dialog-btn cancel" id="deleteCancelBtn">Cancel</button>
                <button class="delete-dialog-btn confirm" id="deleteConfirmBtn">Delete</button>
            </div>

    <script type="module">
        const { invoke } = window.__TAURI__.core;

        // State
        let selectedWeekStart = null; // null means current week
        let calendarViewDate = new Date();
        let selectedMetric = 'steps';
        let weeklyData = null; // Cache for chart rendering
        let cardDetailsData = null; // Cache for card details
        let isCurrentWeek = true;
        let currentTheme = 'dark';

        // Theme functions
        async function loadTheme() {
            try {
                currentTheme = await invoke('get_theme');
                applyTheme(currentTheme);
            } catch (err) {
                console.error('Failed to load theme:', err);
                applyTheme('dark');
            }
        }

        function applyTheme(theme) {
            currentTheme = theme;
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('themeIcon').textContent = '🌙';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeIcon').textContent = '☀️';
            }
        }

        async function toggleTheme() {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            try {
                await invoke('set_theme', { theme: newTheme });
            } catch (err) {
                console.error('Failed to save theme:', err);
            }
        }

        // Utility functions
        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay(); // 0 = Sunday
            d.setDate(d.getDate() - day);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function formatDateYMD(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function isInWeek(date, weekStart) {
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);
            return date >= weekStart && date <= weekEnd;
        }

        function formatDuration(mins) {
            if (!mins) return '';
            if (mins < 60) return `${mins}m`;
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }

        function formatMetrics(metrics) {
            const parts = [];
            if (metrics.steps) parts.push(`${Math.round(metrics.steps).toLocaleString()} steps`);
            if (metrics.distance_m) parts.push(`${(metrics.distance_m / 1000).toFixed(1)} km`);
            if (metrics.calories_kcal) parts.push(`${Math.round(metrics.calories_kcal)} kcal`);
            if (metrics.calories) parts.push(`${Math.round(metrics.calories)} kcal`);
            return parts.join(' · ');
        }

        function renderActivities(activities) {
            const container = document.getElementById('activitiesList');

            if (!activities || activities.length === 0) {
                container.innerHTML = '<div class="empty-state">No recent activities</div>';
                return;
            }

            container.innerHTML = activities.map(activity => {
                const typeDisplay = activity.subtype
                    ? `<span class="type-name">${activity.event_type}</span> <span class="subtype">${activity.subtype}</span>`
                    : `<span class="type-name">${activity.event_type}</span>`;

                const details = formatMetrics(activity.metrics);
                const duration = activity.duration_mins ? formatDuration(activity.duration_mins) : '';
                const time = activity.start_time.split(' ')[1] || activity.start_time;
                const date = activity.start_time.split(' ')[0] || '';

                return `
                    <div class="activity-item" data-event-id="${activity.id}">
                        <div class="activity-time">
                            <div>${time}</div>
                            <div style="color:#444;font-size:10px">${date}</div>
                        </div>
                        <div>
                            <div class="activity-type">${typeDisplay}</div>
                            ${details ? `<div class="activity-details">${details}</div>` : ''}
                            ${activity.tags.length > 0 ? `
                                <div class="activity-tags">
                                    ${activity.tags.slice(0, 4).map(t => `<span class="tag">${t}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <div class="activity-duration">${duration}</div>
                        <button class="activity-delete" title="Delete event" data-id="${activity.id}" data-type="${activity.event_type}${activity.subtype ? ' ' + activity.subtype : ''}" data-time="${activity.start_time}">✕</button>
                    </div>
                `;
            }).join('');

            // Add delete button event listeners
            container.querySelectorAll('.activity-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showDeleteDialog(btn.dataset.id, btn.dataset.type, btn.dataset.time);
                });
            });
        }

        function getMetricValue(day, metric) {
            switch (metric) {
                case 'steps': return day.steps || 0;
                case 'calories': return day.calories || 0;
                case 'distance': return day.distance_km || 0;
                case 'active': return day.active_mins || 0;
                case 'sleep': return day.sleep_hours || 0;
                default: return 0;
            }
        }

        function formatMetricValue(value, metric) {
            if (value === 0) return '';
            switch (metric) {
                case 'steps': return value.toLocaleString();
                case 'calories': return Math.round(value).toLocaleString();
                case 'distance': return value.toFixed(1);
                case 'active': return Math.round(value) + 'm';
                case 'sleep': return value.toFixed(1) + 'h';
                default: return value.toString();
            }
        }

        function renderWeeklyChart(weekly, metric = selectedMetric) {
            // Cache the data for metric switching
            if (weekly) {
                weeklyData = weekly;
            } else {
                weekly = weeklyData;
            }

            const container = document.getElementById('weeklyChart');

            if (!weekly || !weekly.days || weekly.days.length === 0) {
                container.innerHTML = '<div class="empty-state">No data</div>';
                return;
            }

            // Set the metric attribute for CSS styling
            container.setAttribute('data-metric', metric);

            const values = weekly.days.map(d => getMetricValue(d, metric));
            const maxValue = Math.max(...values, 0.1); // Avoid division by zero
            const todayIdx = new Date().getDay(); // 0 = Sunday, matches our week layout

            // Check if we're viewing the current week
            const isCurrentWeek = !selectedWeekStart || isSameDay(selectedWeekStart, getWeekStart(new Date()));

            container.innerHTML = weekly.days.map((day, idx) => {
                const value = getMetricValue(day, metric);
                const height = (value / maxValue) * 100;
                const isToday = isCurrentWeek && idx === todayIdx;
                const isFuture = isCurrentWeek && idx > todayIdx;

                return `
                    <div class="day-column ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}">
                        <div class="day-bar-container">
                            <div class="day-value">${formatMetricValue(value, metric)}</div>
                            <div class="day-bar" style="height: ${Math.max(height, 4)}%"></div>
                        </div>
                        <div class="day-label">${day.day_name}</div>
                        <div class="day-date">${day.date}</div>
                    </div>
                `;
            }).join('');
        }

            flyingValue.textContent = valueText;
            modalValue.textContent = valueText;
            bodyEl.innerHTML = bodyHtml;

            // Get source card position
            const rect = sourceCard.getBoundingClientRect();
            const startX = rect.left;
            const startY = rect.top;
            const startW = rect.width;
            const startH = rect.height;

            // Calculate center position for modal
            const endW = MODAL_WIDTH;
            const endH = MODAL_HEIGHT;
            const endX = (window.innerWidth - endW) / 2;
            const endY = (window.innerHeight - endH) / 2;

            // Hide source card
            sourceCard.classList.add('animating');

            // Position flying card at source
            flyingCard.style.left = startX + 'px';
            flyingCard.style.top = startY + 'px';
            flyingCard.style.width = startW + 'px';
            flyingCard.style.height = startH + 'px';
            flyingCard.style.transition = 'none';
            flyingCard.classList.remove('flipped');
            flyingCard.classList.add('show');

            // Force reflow
            flyingCard.offsetHeight;

            // Show backdrop gradually
            overlay.classList.add('show');

            // Animate to center with flip
            flyingCard.style.transition = `all ${ANIMATION_DURATION}ms cubic-bezier(0.4, 0, 0.2, 1)`;
            flyingCard.style.left = endX + 'px';
            flyingCard.style.top = endY + 'px';
            flyingCard.style.width = endW + 'px';
            flyingCard.style.height = endH + 'px';
            flyingCard.classList.add('flipped');

            // Bind close button after animation starts
            setTimeout(() => {
                isAnimating = false;
            }, ANIMATION_DURATION);
        }

            if (isAnimating || !currentSourceCard) return;

            const rect = currentSourceCard.getBoundingClientRect();

            }, ANIMATION_DURATION);

        function renderCalendar() {
            const container = document.getElementById('calendarDays');
            const monthYearLabel = document.getElementById('calendarMonthYear');

            const year = calendarViewDate.getFullYear();
            const month = calendarViewDate.getMonth();

            monthYearLabel.textContent = calendarViewDate.toLocaleDateString('en-US', {
                month: 'long',
                year: 'numeric'
            });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startPadding = firstDay.getDay(); // Days to show from prev month

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const currentWeekStart = selectedWeekStart || getWeekStart(today);

            let html = '';

            // Previous month days
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startPadding - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const date = new Date(year, month - 1, day);
                const classes = ['calendar-day', 'other-month'];
                if (isInWeek(date, currentWeekStart)) {
                    classes.push('selected-week');
                    if (date.getDay() === 0) classes.push('week-start');
                    if (date.getDay() === 6) classes.push('week-end');
                }
                html += `<div class="${classes.join(' ')}" data-date="${formatDateYMD(date)}">${day}</div>`;
            }

            // Current month days
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const classes = ['calendar-day'];

                if (isSameDay(date, today)) classes.push('today');
                if (isInWeek(date, currentWeekStart)) {
                    classes.push('selected-week');
                    if (date.getDay() === 0) classes.push('week-start');
                    if (date.getDay() === 6) classes.push('week-end');
                }

                html += `<div class="${classes.join(' ')}" data-date="${formatDateYMD(date)}">${day}</div>`;
            }

            // Next month days
            const totalCells = Math.ceil((startPadding + lastDay.getDate()) / 7) * 7;
            const remaining = totalCells - (startPadding + lastDay.getDate());
            for (let day = 1; day <= remaining; day++) {
                const date = new Date(year, month + 1, day);
                const classes = ['calendar-day', 'other-month'];
                if (isInWeek(date, currentWeekStart)) {
                    classes.push('selected-week');
                    if (date.getDay() === 0) classes.push('week-start');
                    if (date.getDay() === 6) classes.push('week-end');
                }
                html += `<div class="${classes.join(' ')}" data-date="${formatDateYMD(date)}">${day}</div>`;
            }

            container.innerHTML = html;

            // Add click handlers
            container.querySelectorAll('.calendar-day').forEach(el => {
                el.addEventListener('click', () => {
                    const dateStr = el.getAttribute('data-date');
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const clickedDate = new Date(y, m - 1, d);
                    selectedWeekStart = getWeekStart(clickedDate);
                    renderCalendar();
                    updateDashboard();
                    closeCalendar();
                });
            });
        }

            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', (e) => {
            e.stopPropagation();
            calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('selectCurrentWeek').addEventListener('click', (e) => {
            e.stopPropagation();
            selectedWeekStart = null; // null means current week
            calendarViewDate = new Date();
            renderCalendar();
            updateDashboard();
            closeCalendar();
        });

        // Close calendar when clicking outside
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('calendarDropdown');
            const btn = document.getElementById('weekSelectorBtn');
            if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                closeCalendar();
            }
        });

        // Chart tab click handlers
        document.querySelectorAll('.chart-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const metric = tab.getAttribute('data-metric');
                switchMetric(metric);
            });
        });

        // Stat card click handlers - open modals
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', () => {
                const metric = card.getAttribute('data-metric');
                openModal(metric, card);
            });
        });

        // Modal close handlers
        document.getElementById('modalClose').addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
        });

        // Click on backdrop to close
        document.getElementById('modalOverlay').addEventListener('click', closeModal);

        // Click on flying card back (modal area) should not close
        document.getElementById('flyingCard').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize tab indicator position after DOM is ready
        setTimeout(updateTabIndicator, 0);
        window.addEventListener('resize', updateTabIndicator);

        // Theme toggle handler
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // Initialize
        loadTheme(); // Load saved theme first
        updateDashboard();
        setInterval(updateDashboard, 10000); // Update every 10 seconds
    </script>
</body>
</html>
