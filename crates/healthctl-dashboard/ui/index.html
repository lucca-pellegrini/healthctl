<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCtl Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 300;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected { background: #00ff88; }
        .status-dot.error { background: #ff4444; }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 16px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: #888;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Today's Summary */
        .today-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-box {
            background: #1a1a1a;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #00d4ff;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .stat-box.sleep .stat-value { color: #9966ff; }
        .stat-box.workouts .stat-value { color: #ff6644; }

        /* Recent Activities */
        .activities-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .activity-item {
            display: grid;
            grid-template-columns: 70px 1fr auto;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
            align-items: center;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-time {
            font-size: 12px;
            color: #666;
            font-family: monospace;
        }

        .activity-type {
            font-weight: 500;
        }

        .activity-type .type-name {
            color: #00d4ff;
        }

        .activity-type .subtype {
            color: #888;
            font-weight: 400;
        }

        .activity-details {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .activity-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 10px;
            background: #222;
            color: #888;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .activity-duration {
            font-size: 12px;
            color: #00ff88;
            font-family: monospace;
        }

        /* Weekly Chart */
        .weekly-chart {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .day-column {
            text-align: center;
        }

        .day-bar-container {
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .day-bar {
            width: 100%;
            max-width: 40px;
            background: linear-gradient(to top, #00d4ff, #00ff88);
            border-radius: 4px 4px 0 0;
            min-height: 4px;
        }

        .day-value {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
        }

        .day-label {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
        }

        .day-date {
            font-size: 9px;
            color: #444;
        }

        .day-column.today .day-label {
            color: #00d4ff;
            font-weight: 600;
        }

        .day-column.future {
            opacity: 0.3;
        }

        /* Chart Tabs */
        .chart-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            position: relative;
            background: #1a1a1a;
            border-radius: 6px;
            padding: 4px;
        }

        .chart-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #666;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s;
            position: relative;
            z-index: 1;
        }

        .chart-tab:hover {
            color: #888;
        }

        .chart-tab.active {
            color: #fff;
        }

        .tab-indicator {
            position: absolute;
            height: calc(100% - 8px);
            top: 4px;
            border-radius: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }

        /* Metric-specific colors */
        .chart-tab.active[data-metric="steps"] { color: #00d4ff; }
        .chart-tab.active[data-metric="calories"] { color: #44dd88; }
        .chart-tab.active[data-metric="distance"] { color: #aa88ff; }
        .chart-tab.active[data-metric="active"] { color: #ff8844; }
        .chart-tab.active[data-metric="sleep"] { color: #6699ff; }

        /* Bar color schemes */
        .weekly-chart[data-metric="steps"] .day-bar {
            background: linear-gradient(to top, #00d4ff, #00ff88);
        }
        .weekly-chart[data-metric="calories"] .day-bar {
            background: linear-gradient(to top, #22aa66, #66ee99);
        }
        .weekly-chart[data-metric="distance"] .day-bar {
            background: linear-gradient(to top, #8855ee, #bb99ff);
        }
        .weekly-chart[data-metric="active"] .day-bar {
            background: linear-gradient(to top, #ff5522, #ffaa44);
        }
        .weekly-chart[data-metric="sleep"] .day-bar {
            background: linear-gradient(to top, #4477dd, #88bbff);
        }

        /* Week Selector */
        .week-selector {
            position: relative;
            display: inline-block;
        }

        .week-selector-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #00d4ff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .week-selector-btn:hover {
            background: #222;
            border-color: #00d4ff;
        }

        .week-selector-btn .arrow {
            font-size: 8px;
        }

        .calendar-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 8px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            z-index: 1000;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .calendar-dropdown.show {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-nav {
            background: none;
            border: 1px solid #333;
            color: #888;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .calendar-nav:hover {
            background: #222;
            color: #00d4ff;
            border-color: #00d4ff;
        }

        .calendar-month-year {
            color: #e0e0e0;
            font-weight: 500;
            font-size: 14px;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 4px;
        }

        .calendar-weekday {
            text-align: center;
            font-size: 10px;
            color: #666;
            padding: 4px;
            text-transform: uppercase;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-day {
            text-align: center;
            padding: 8px 4px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .calendar-day:hover {
            background: #222;
            color: #e0e0e0;
        }

        .calendar-day.other-month {
            color: #444;
        }

        .calendar-day.today {
            color: #00d4ff;
            font-weight: 600;
        }

        .calendar-day.selected-week {
            background: linear-gradient(135deg, #00d4ff22, #00ff8822);
        }

        .calendar-day.week-start {
            border-radius: 4px 0 0 4px;
        }

        .calendar-day.week-end {
            border-radius: 0 4px 4px 0;
        }

        .calendar-day.selected-week.today {
            background: linear-gradient(135deg, #00d4ff44, #00ff8844);
        }

        .calendar-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #222;
        }

        .calendar-action-btn {
            background: none;
            border: 1px solid #333;
            color: #888;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .calendar-action-btn:hover {
            background: #222;
            color: #e0e0e0;
        }

        .calendar-action-btn.primary {
            background: #00d4ff22;
            border-color: #00d4ff44;
            color: #00d4ff;
        }

        .calendar-action-btn.primary:hover {
            background: #00d4ff33;
        }

        /* Empty state */
        .empty-state {
            color: #444;
            text-align: center;
            padding: 40px;
            font-style: italic;
        }

        /* Loading */
        .loading {
            color: #666;
            text-align: center;
            padding: 20px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Fitness Dashboard</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="dashboard">
        <!-- Weekly Summary -->
        <div class="panel">
            <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span id="summaryTitle">This Week</span>
                <div class="week-selector">
                    <button class="week-selector-btn" id="weekSelectorBtn">
                        <span id="weekSelectorLabel">Select Week</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="calendar-dropdown" id="calendarDropdown">
                        <div class="calendar-header">
                            <button class="calendar-nav" id="prevMonth">◀</button>
                            <span class="calendar-month-year" id="calendarMonthYear"></span>
                            <button class="calendar-nav" id="nextMonth">▶</button>
                        </div>
                        <div class="calendar-weekdays">
                            <div class="calendar-weekday">Sun</div>
                            <div class="calendar-weekday">Mon</div>
                            <div class="calendar-weekday">Tue</div>
                            <div class="calendar-weekday">Wed</div>
                            <div class="calendar-weekday">Thu</div>
                            <div class="calendar-weekday">Fri</div>
                            <div class="calendar-weekday">Sat</div>
                        </div>
                        <div class="calendar-days" id="calendarDays"></div>
                        <div class="calendar-actions">
                            <button class="calendar-action-btn primary" id="selectCurrentWeek">Current Week</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="today-grid" id="weekGrid">
                <div class="stat-box">
                    <div class="stat-value" id="weekSteps">--</div>
                    <div class="stat-label">Steps</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="weekCalories">--</div>
                    <div class="stat-label">Calories</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="weekDistance">--</div>
                    <div class="stat-label">km</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="weekActive">--</div>
                    <div class="stat-label">Active min</div>
                </div>
                <div class="stat-box sleep">
                    <div class="stat-value" id="weekSleep">--</div>
                    <div class="stat-label">Avg Sleep</div>
                </div>
                <div class="stat-box workouts">
                    <div class="stat-value" id="weekWorkouts">--</div>
                    <div class="stat-label">Workouts</div>
                </div>
            </div>
        </div>

        <!-- Weekly Chart -->
        <div class="panel">
            <div class="panel-title" id="chartTitle">This Week</div>
            <div class="chart-tabs">
                <button class="chart-tab active" data-metric="steps">Steps</button>
                <button class="chart-tab" data-metric="calories">Calories</button>
                <button class="chart-tab" data-metric="distance">Distance</button>
                <button class="chart-tab" data-metric="active">Active</button>
                <button class="chart-tab" data-metric="sleep">Sleep</button>
                <div class="tab-indicator" id="tabIndicator"></div>
            </div>
            <div class="weekly-chart" id="weeklyChart" data-metric="steps">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- Recent Activities -->
        <div class="panel" style="grid-column: span 2;">
            <div class="panel-title" id="activitiesTitle">Recent Activities</div>
            <div class="activities-list" id="activitiesList">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script type="module">
        const { invoke } = window.__TAURI__.core;

        // State
        let selectedWeekStart = null; // null means current week
        let calendarViewDate = new Date();
        let selectedMetric = 'steps';
        let weeklyData = null; // Cache for chart rendering

        // Utility functions
        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay(); // 0 = Sunday
            d.setDate(d.getDate() - day);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function formatDateYMD(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function isInWeek(date, weekStart) {
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);
            return date >= weekStart && date <= weekEnd;
        }

        function formatDuration(mins) {
            if (!mins) return '';
            if (mins < 60) return `${mins}m`;
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return m > 0 ? `${h}h ${m}m` : `${h}h`;
        }

        function formatMetrics(metrics) {
            const parts = [];
            if (metrics.steps) parts.push(`${Math.round(metrics.steps).toLocaleString()} steps`);
            if (metrics.distance_m) parts.push(`${(metrics.distance_m / 1000).toFixed(1)} km`);
            if (metrics.calories_kcal) parts.push(`${Math.round(metrics.calories_kcal)} kcal`);
            if (metrics.calories) parts.push(`${Math.round(metrics.calories)} kcal`);
            return parts.join(' · ');
        }

        function renderActivities(activities) {
            const container = document.getElementById('activitiesList');

            if (!activities || activities.length === 0) {
                container.innerHTML = '<div class="empty-state">No recent activities</div>';
                return;
            }

            container.innerHTML = activities.map(activity => {
                const typeDisplay = activity.subtype
                    ? `<span class="type-name">${activity.event_type}</span> <span class="subtype">${activity.subtype}</span>`
                    : `<span class="type-name">${activity.event_type}</span>`;

                const details = formatMetrics(activity.metrics);
                const duration = activity.duration_mins ? formatDuration(activity.duration_mins) : '';
                const time = activity.start_time.split(' ')[1] || activity.start_time;
                const date = activity.start_time.split(' ')[0] || '';

                return `
                    <div class="activity-item">
                        <div class="activity-time">
                            <div>${time}</div>
                            <div style="color:#444;font-size:10px">${date}</div>
                        </div>
                        <div>
                            <div class="activity-type">${typeDisplay}</div>
                            ${details ? `<div class="activity-details">${details}</div>` : ''}
                            ${activity.tags.length > 0 ? `
                                <div class="activity-tags">
                                    ${activity.tags.slice(0, 4).map(t => `<span class="tag">${t}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <div class="activity-duration">${duration}</div>
                    </div>
                `;
            }).join('');
        }

        function getMetricValue(day, metric) {
            switch (metric) {
                case 'steps': return day.steps || 0;
                case 'calories': return day.calories || 0;
                case 'distance': return day.distance_km || 0;
                case 'active': return day.active_mins || 0;
                case 'sleep': return day.sleep_hours || 0;
                default: return 0;
            }
        }

        function formatMetricValue(value, metric) {
            if (value === 0) return '';
            switch (metric) {
                case 'steps': return value.toLocaleString();
                case 'calories': return Math.round(value).toLocaleString();
                case 'distance': return value.toFixed(1);
                case 'active': return Math.round(value) + 'm';
                case 'sleep': return value.toFixed(1) + 'h';
                default: return value.toString();
            }
        }

        function renderWeeklyChart(weekly, metric = selectedMetric) {
            // Cache the data for metric switching
            if (weekly) {
                weeklyData = weekly;
            } else {
                weekly = weeklyData;
            }

            const container = document.getElementById('weeklyChart');

            if (!weekly || !weekly.days || weekly.days.length === 0) {
                container.innerHTML = '<div class="empty-state">No data</div>';
                return;
            }

            // Set the metric attribute for CSS styling
            container.setAttribute('data-metric', metric);

            const values = weekly.days.map(d => getMetricValue(d, metric));
            const maxValue = Math.max(...values, 0.1); // Avoid division by zero
            const todayIdx = new Date().getDay(); // 0 = Sunday, matches our week layout

            // Check if we're viewing the current week
            const isCurrentWeek = !selectedWeekStart || isSameDay(selectedWeekStart, getWeekStart(new Date()));

            container.innerHTML = weekly.days.map((day, idx) => {
                const value = getMetricValue(day, metric);
                const height = (value / maxValue) * 100;
                const isToday = isCurrentWeek && idx === todayIdx;
                const isFuture = isCurrentWeek && idx > todayIdx;

                return `
                    <div class="day-column ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''}">
                        <div class="day-bar-container">
                            <div class="day-value">${formatMetricValue(value, metric)}</div>
                            <div class="day-bar" style="height: ${Math.max(height, 4)}%"></div>
                        </div>
                        <div class="day-label">${day.day_name}</div>
                        <div class="day-date">${day.date}</div>
                    </div>
                `;
            }).join('');
        }

        function updateTabIndicator() {
            const activeTab = document.querySelector('.chart-tab.active');
            const indicator = document.getElementById('tabIndicator');
            if (activeTab && indicator) {
                const metric = activeTab.getAttribute('data-metric');
                const colors = {
                    steps: '#00d4ff',
                    calories: '#44dd88',
                    distance: '#aa88ff',
                    active: '#ff8844',
                    sleep: '#6699ff'
                };
                indicator.style.left = activeTab.offsetLeft + 'px';
                indicator.style.width = activeTab.offsetWidth + 'px';
                indicator.style.background = colors[metric] + '33';
            }
        }

        function switchMetric(metric) {
            selectedMetric = metric;

            // Update active tab
            document.querySelectorAll('.chart-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-metric') === metric);
            });

            // Update indicator
            updateTabIndicator();

            // Re-render chart with cached data
            renderWeeklyChart(null, metric);
        }

        function renderWeekSummary(week) {
            // Update panel titles based on selected week
            const isCurrentWeek = !selectedWeekStart || isSameDay(selectedWeekStart, getWeekStart(new Date()));
            const weekLabel = isCurrentWeek
                ? 'This Week'
                : `${week.week_start} - ${week.week_end}`;

            document.getElementById('summaryTitle').textContent = weekLabel;
            document.getElementById('chartTitle').textContent = weekLabel;
            document.getElementById('activitiesTitle').textContent =
                isCurrentWeek ? 'Recent Activities' : `Activities: ${week.week_start} - ${week.week_end}`;

            // Update stats
            document.getElementById('weekSteps').textContent =
                week.total_steps > 0 ? week.total_steps.toLocaleString() : '0';
            document.getElementById('weekCalories').textContent =
                week.total_calories > 0 ? Math.round(week.total_calories).toLocaleString() : '0';
            document.getElementById('weekDistance').textContent =
                week.total_distance_km > 0 ? week.total_distance_km.toFixed(1) : '0';
            document.getElementById('weekActive').textContent =
                week.total_active_mins > 0 ? week.total_active_mins.toLocaleString() : '0';
            document.getElementById('weekSleep').textContent =
                week.avg_sleep_hours ? week.avg_sleep_hours.toFixed(1) : '--';
            document.getElementById('weekWorkouts').textContent =
                week.workout_count;
        }

        function setStatus(connected, message) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'status-dot ' + (connected ? 'connected' : 'error');
            text.textContent = message;
        }

        async function updateDashboard() {
            try {
                // Note: Tauri converts camelCase JS to snake_case Rust automatically
                const params = {
                    weekStartDate: selectedWeekStart ? formatDateYMD(selectedWeekStart) : null
                };

                const data = await invoke('get_dashboard_data', params);

                setStatus(true, data.connection_status);
                renderWeekSummary(data.week_summary);
                renderWeeklyChart(data.weekly);
                renderActivities(data.recent_activities);
                updateWeekSelectorLabel();

            } catch (error) {
                console.error('Failed to fetch data:', error);
                setStatus(false, `Error: ${error}`);
            }
        }

        function updateWeekSelectorLabel() {
            const label = document.getElementById('weekSelectorLabel');
            if (!selectedWeekStart) {
                label.textContent = 'Current Week';
            } else {
                const weekEnd = new Date(selectedWeekStart);
                weekEnd.setDate(weekEnd.getDate() + 6);
                const opts = { month: 'short', day: 'numeric' };
                label.textContent = `${selectedWeekStart.toLocaleDateString('en-US', opts)} - ${weekEnd.toLocaleDateString('en-US', opts)}`;
            }
        }

        function renderCalendar() {
            const container = document.getElementById('calendarDays');
            const monthYearLabel = document.getElementById('calendarMonthYear');

            const year = calendarViewDate.getFullYear();
            const month = calendarViewDate.getMonth();

            monthYearLabel.textContent = calendarViewDate.toLocaleDateString('en-US', {
                month: 'long',
                year: 'numeric'
            });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startPadding = firstDay.getDay(); // Days to show from prev month

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const currentWeekStart = selectedWeekStart || getWeekStart(today);

            let html = '';

            // Previous month days
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startPadding - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const date = new Date(year, month - 1, day);
                const classes = ['calendar-day', 'other-month'];
                if (isInWeek(date, currentWeekStart)) {
                    classes.push('selected-week');
                    if (date.getDay() === 0) classes.push('week-start');
                    if (date.getDay() === 6) classes.push('week-end');
                }
                html += `<div class="${classes.join(' ')}" data-date="${formatDateYMD(date)}">${day}</div>`;
            }

            // Current month days
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const classes = ['calendar-day'];

                if (isSameDay(date, today)) classes.push('today');
                if (isInWeek(date, currentWeekStart)) {
                    classes.push('selected-week');
                    if (date.getDay() === 0) classes.push('week-start');
                    if (date.getDay() === 6) classes.push('week-end');
                }

                html += `<div class="${classes.join(' ')}" data-date="${formatDateYMD(date)}">${day}</div>`;
            }

            // Next month days
            const totalCells = Math.ceil((startPadding + lastDay.getDate()) / 7) * 7;
            const remaining = totalCells - (startPadding + lastDay.getDate());
            for (let day = 1; day <= remaining; day++) {
                const date = new Date(year, month + 1, day);
                const classes = ['calendar-day', 'other-month'];
                if (isInWeek(date, currentWeekStart)) {
                    classes.push('selected-week');
                    if (date.getDay() === 0) classes.push('week-start');
                    if (date.getDay() === 6) classes.push('week-end');
                }
                html += `<div class="${classes.join(' ')}" data-date="${formatDateYMD(date)}">${day}</div>`;
            }

            container.innerHTML = html;

            // Add click handlers
            container.querySelectorAll('.calendar-day').forEach(el => {
                el.addEventListener('click', () => {
                    const dateStr = el.getAttribute('data-date');
                    const [y, m, d] = dateStr.split('-').map(Number);
                    const clickedDate = new Date(y, m - 1, d);
                    selectedWeekStart = getWeekStart(clickedDate);
                    renderCalendar();
                    updateDashboard();
                    closeCalendar();
                });
            });
        }

        function closeCalendar() {
            document.getElementById('calendarDropdown').classList.remove('show');
        }

        // Calendar event listeners
        document.getElementById('weekSelectorBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            const dropdown = document.getElementById('calendarDropdown');
            const isOpen = dropdown.classList.contains('show');

            if (!isOpen) {
                // Set calendar view to the selected week's month
                calendarViewDate = selectedWeekStart ? new Date(selectedWeekStart) : new Date();
                renderCalendar();
            }

            dropdown.classList.toggle('show');
        });

        document.getElementById('prevMonth').addEventListener('click', (e) => {
            e.stopPropagation();
            calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', (e) => {
            e.stopPropagation();
            calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('selectCurrentWeek').addEventListener('click', (e) => {
            e.stopPropagation();
            selectedWeekStart = null; // null means current week
            calendarViewDate = new Date();
            renderCalendar();
            updateDashboard();
            closeCalendar();
        });

        // Close calendar when clicking outside
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('calendarDropdown');
            const btn = document.getElementById('weekSelectorBtn');
            if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                closeCalendar();
            }
        });

        // Chart tab click handlers
        document.querySelectorAll('.chart-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const metric = tab.getAttribute('data-metric');
                switchMetric(metric);
            });
        });

        // Initialize tab indicator position after DOM is ready
        setTimeout(updateTabIndicator, 0);
        window.addEventListener('resize', updateTabIndicator);

        // Initialize
        updateDashboard();
        setInterval(updateDashboard, 10000); // Update every 10 seconds
    </script>
</body>
</html>
